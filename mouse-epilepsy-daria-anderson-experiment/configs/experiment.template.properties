# Mouse experiment configuration template
# Copy via newMouseExperiment('column') or edit and run:
#   runMouseExperiment('configs/<name>.properties')

# Base folder name under results/ (runMouseExperiment appends _yyyy-mm-dd_HHMM at run time)
experiment.name=REPLACE_ME
experiment.description=

normalisation=column
parkes.c=1.0
col.scale=0.95
x0.base=-2.3
x0.upper=-1.0
x0.step=0.01
bisect.tol=1e-4
max.k=1e8
tau0=6667
top.k=10

corr.type=Spearman
alpha=0.05
z.threshold=2
# Basis for the per-Anderson L-R z-score and Bonferroni flagging in
# compareLeftRightAsymmetry. 'signed' uses LI_signed = L - R (raw
# difference, matches the manuscript spec); 'norm' uses
# LI_norm = (L - R)/(L + R). Group-level Welch and systematic sign-rank
# are always on LI_norm.
laterality.basis=signed
# Mouse ID prefixes for case vs control groups (compareAndersonVsArnold, LR asymmetry, comparison figures)
cohort.case.prefix=Anderson
cohort.control.prefix=Arnold

pipeline.runHeatmap=false
pipeline.runStabilityCentralities=true
pipeline.runCentralityCorr=true
pipeline.runAndersonVsArnold=true
pipeline.runLRAsymmetry=true
pipeline.runDstCohort=true
pipeline.runReports=true
pipeline.stopOnError=false

save.results=true
plot=true
verbose=true
