# ---------------------------------------------------------------------------
# Connectome stability experiment -- configuration template
#
# One config file = one experiment = one normalisation scheme + one parameter
# set + one timestamped results folder.
#
#   cd /path/to/my-study
#   setupConnectomePaths();
#   newConnectomeExperiment('Name', 'pilot', 'Normalisation', 'column');
#   runConnectomeExperiment('configs/pilot.properties');
#
# Syntax: key=value, one per line. '#' or '!' starts a comment.
# Every key below is optional; the value shown is the built-in default.
# ---------------------------------------------------------------------------

# --- Experiment identity ---------------------------------------------------
# Base name of the results folder. runConnectomeExperiment appends
# _yyyy-mm-dd_HHMM at run time, so re-running never overwrites a previous run.
experiment.name=REPLACE_ME
experiment.description=

# --- Project layout --------------------------------------------------------
# Relative paths resolve against the project root, which defaults to the
# parent of this configs/ folder.
# project.root=
data.root=data
results.root=results
# Connectome filename inside each data/<subjectId>/ folder. A labelled CSV
# (header row of node names, first column of matching row labels) or a plain
# numeric matrix.
data.file=connectome.csv
# Explicit subject list; leave empty to discover every data/<id>/ folder that
# contains data.file.
# subjects=Case_1,Case_2,Ctrl_1,Ctrl_2

# --- Cohort grouping -------------------------------------------------------
# Subjects are split into groups by the prefix of their folder name, so no
# separate group table is needed.
cohort.case.prefix=Case
cohort.control.prefix=Ctrl

# --- Atlas conventions -----------------------------------------------------
# Prefixes that mark the two hemispheres, used to pair homotopic regions for
# the laterality analysis. Set to e.g. lh. / rh. for FreeSurfer naming.
hemisphere.left.prefix=L-
hemisphere.right.prefix=R-
# Label suffixes that mark non-physical atlas placeholder rows (background,
# masks). Nodes matching these -- and nodes with no edges at all -- are
# excluded from rankings, sweeps and statistical families. Comma-separated;
# leave empty if the atlas has no placeholder rows.
trivial.label.suffixes=

# --- Normalisation ---------------------------------------------------------
# column : rescale each column to sum to col.scale. Asymmetric, so D(k->)
#          differs from D(->i). Linear: no Epileptor model.
# parkes : A / (|lambda|_max + parkes.c). Symmetric, linear.
# tvb    : truncate at tvb.percentile and rescale to [0,1], then solve a
#          1-D Epileptor fixed point. Enables the critical-excitability sweep.
# none   : raw weights, then the Epileptor fixed point.
normalisation=column
col.scale=0.95
parkes.c=1.0
tvb.percentile=95

# --- 1-D Epileptor model (tvb and none schemes only) -----------------------
# Requires the Optimization Toolbox (fsolve).
tau0=6667
x0.base=-2.3
x0.upper=-1.0
x0.step=0.01
bisect.tol=1e-4

# --- Covariance solver -----------------------------------------------------
# Iteration cap for covariancesGaussianNet when it falls back to the power
# series. Raise it if a run warns about non-convergence.
max.k=1e8

# --- Reporting and statistics ----------------------------------------------
# Rows listed in the console reports.
top.k=10
# Correlation type in compareCentralityMeasures: Spearman or Pearson.
corr.type=Spearman
# Family-wise error rate for the Bonferroni correction that decides which
# nodes count as outliers.
alpha=0.05
# Display-only |z| filter for the console reports. It never changes which
# nodes were flagged -- that is decided by alpha.
z.threshold=2
# Basis for the per-subject laterality z-scores and flagging:
#   signed = L - R          (raw difference, in the metric's own units)
#   norm   = (L-R)/(L+R)    (bounded in [-1,1])
# Group-level and systematic tests always use the normalised index.
laterality.basis=signed

# --- Pipeline steps --------------------------------------------------------
pipeline.runQc=false
pipeline.runStabilityCentralities=true
pipeline.runCentralityCorr=true
pipeline.runCohortComparison=true
pipeline.runHemisphericAsymmetry=true
pipeline.runDstCohort=true
pipeline.runSummaryFigures=true
pipeline.runReports=true
# Abort the whole run on the first failed step instead of recording it and
# carrying on.
pipeline.stopOnError=false

# --- Output ----------------------------------------------------------------
save.results=true
plot=true
verbose=true
