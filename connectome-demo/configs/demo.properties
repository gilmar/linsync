# Runnable demo: synthetic bilateral cohort, column normalisation.
#
#   cd connectome-demo
#   setupConnectomePaths();
#   makeSyntheticCohort('data');
#   runConnectomeExperiment('configs/demo.properties');
#
# See README.md in this folder for what the run produces.

experiment.name=demo_column
experiment.description=Synthetic 2-case / 4-control cohort, column normalisation

data.root=data
results.root=results
data.file=connectome.csv

cohort.case.prefix=Case
cohort.control.prefix=Ctrl

hemisphere.left.prefix=L-
hemisphere.right.prefix=R-
trivial.label.suffixes=BACKGROUND

# Column normalisation keeps the coupling matrix asymmetric, so D(->i) and
# D(k->) carry different information, and needs no Epileptor solve -- which
# makes the demo run in seconds and without the Optimization Toolbox.
normalisation=column
col.scale=0.95

max.k=1e8

top.k=10
corr.type=Spearman
alpha=0.05
z.threshold=2
laterality.basis=signed

pipeline.runQc=true
pipeline.runStabilityCentralities=true
pipeline.runCentralityCorr=true
pipeline.runCohortComparison=true
pipeline.runHemisphericAsymmetry=true
pipeline.runDstCohort=true
pipeline.runSummaryFigures=true
pipeline.runReports=true
pipeline.stopOnError=false

save.results=true
plot=true
verbose=false
